name: Build Ubuntu 22.04 ARM64 Server

on:
  workflow_dispatch:

jobs:
  build-arm64:
    # 用 x86_64 runner 交叉编译 ARM64（x86_64 runner 秒分配）
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup ARM64 cross-compilation environment
      run: |
        # ARM64 架构支持（用于安装 ARM64 系统库）
        sudo dpkg --add-architecture arm64
        sudo apt-get update

        # 交叉编译器 + 构建工具
        sudo apt-get install -y \
          autoconf \
          cmake \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          git \
          libtool \
          make \
          ninja-build \
          pkg-config \
          wget \
          xz-utils

        # ARM64 系统库（因为我们是交叉编译 + TOOLCHAIN_OPENSSL=OFF/ZLIB=OFF）
        sudo apt-get install -y \
          libssl-dev:arm64 \
          zlib1g-dev:arm64

    - name: Build TeamTalk Server (cross-compile to ARM64)
      working-directory: ${{ github.workspace }}
      run: |
        source env.sh
        
        # 设置交叉编译器环境变量，ExternalProject (ACE 等) 会继承这些变量
        export CC=aarch64-linux-gnu-gcc
        export CXX=aarch64-linux-gnu-g++
        export AR=aarch64-linux-gnu-ar
        export RANLIB=aarch64-linux-gnu-ranlib
        export LD=aarch64-linux-gnu-ld
        export STRIP=aarch64-linux-gnu-strip

        make -C Build CMAKE_EXTRA="-G Ninja \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -DTOOLCHAIN_OPENSSL=OFF \
          -DTOOLCHAIN_ZLIB=OFF \
          -DTOOLCHAIN_LIBVPX=OFF \
          -DTOOLCHAIN_FFMPEG=OFF \
          -DTOOLCHAIN_OGG=OFF \
          -DTOOLCHAIN_OPUS=OFF \
          -DTOOLCHAIN_PORTAUDIO=OFF \
          -DTOOLCHAIN_SPEEX=OFF \
          -DTOOLCHAIN_SPEEXDSP=OFF \
          -DTOOLCHAIN_CATCH2=OFF \
          -DBUILD_TEAMTALK_CLIENTS=OFF \
          -DBUILD_TEAMTALK_DOCUMENTATION=OFF \
          -DBUILD_TEAMTALK_LIBRARY_DLL=OFF \
          -DBUILD_TEAMTALK_LIBRARY_DLLPRO=OFF \
          -DBUILD_TEAMTALK_LIBRARY_LIB=OFF \
          -DBUILD_TEAMTALK_LIBRARY_LIBPRO=OFF \
          -DBUILD_TEAMTALK_SERVER_SRVEXE=ON \
          -DBUILD_TEAMTALK_SERVER_SRVEXEPRO=ON \
          -DBUILD_TEAMTALK_LIBRARY_UNITTEST_CATCH2=OFF \
          -DBUILD_TEAMTALK_LIBRARY_JNI=OFF \
          -DBUILD_TEAMTALK_LIBRARY_JNIPRO=OFF \
          -DBUILD_TEAMTALK_LIBRARY_JAR=OFF \
          -DBUILD_TEAMTALK_LIBRARY_JARPRO=OFF \
          -DFEATURE_WEBRTC=OFF \
          -DFEATURE_FFMPEG=OFF \
          -DFEATURE_PORTAUDIO=OFF \
          -DFEATURE_V4L2=OFF \
          -DFEATURE_LIBVPX=OFF \
          -DFEATURE_OGG=OFF \
          -DFEATURE_OPUS=OFF \
          -DFEATURE_OPUSTOOLS=OFF \
          -DFEATURE_SPEEX=OFF \
          -DFEATURE_SPEEXDSP=OFF" \
          BUILDDIR=build-release-ubuntu22-arm64 \
          buildlib

    - name: Verify binary architecture
      run: |
        echo "=== tt5srv ==="
        file Server/tt5srv
        echo "=== tt5prosrv ==="
        file Server/tt5prosrv
        echo "=== readelf ==="
        aarch64-linux-gnu-readelf -h Server/tt5srv | grep -E "Class|Machine|Entry"

    - name: Package server binaries
      run: |
        mkdir -p artifact
        cp Server/tt5srv Server/tt5prosrv artifact/
        cp Library/TeamTalkLib/test/tt5srv.xml_template artifact/ 2>/dev/null || true
        cp Library/TeamTalkLib/test/tt5prosrv.xml_template artifact/ 2>/dev/null || true
        cd artifact
        aarch64-linux-gnu-strip tt5srv tt5prosrv
        tar czf teamtalk5-server-ubuntu22-arm64.tar.gz *
        cd ..
        cp artifact/teamtalk5-server-ubuntu22-arm64.tar.gz .

    - name: Upload server binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: teamtalk5-server-ubuntu22-arm64
        path: teamtalk5-server-ubuntu22-arm64.tar.gz
        retention-days: 30
